<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mağaza Sağlık Raporu — KRT Saha</title>
<style>
  :root{--bg:#f6f6fb;--panel:#fff;--ink:#12152c;--muted:#5b6078;--line:#e3e4ee;--mor:#5546ea;--yesil:#14a35f;--kirmizi:#d42f2f;--turuncu:#c76a00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kap{max-width:980px;margin:0 auto;padding:28px 22px 60px}
  .ust{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
  .ust h1{margin:0;font-size:30px;letter-spacing:-.8px}
  .ust .alt{color:var(--muted);font-size:14px}
  .marka{font-weight:800;font-size:18px;text-align:right}.marka i{font-style:normal;color:var(--mor)}
  .manset{margin:24px 0;background:linear-gradient(135deg,#2b2170,#5546ea);color:#fff;border-radius:20px;padding:26px 28px}
  .manset .b{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
  .manset .d{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin:6px 0}
  .manset .a{opacity:.9;max-width:640px}
  .uclu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .uclu div{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px}
  .uclu b{display:block;font-size:22px}.uclu span{font-size:13px;opacity:.9}
  .kutular{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
  .kutu{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .kutu .b{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kutu .d{font-size:22px;font-weight:800;margin-top:2px}
  .kutu .a{font-size:12.5px;color:var(--muted)}
  section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:16px 0;break-inside:avoid-page}
  section h2{margin:0 0 4px;font-size:21px;letter-spacing:-.4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  section h2 small{font-size:15px;font-weight:800}
  .ac{color:var(--muted);margin:0 0 12px;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  td:first-child small{display:block;color:var(--muted);font-size:11.5px}
  .k{color:var(--kirmizi);font-weight:700}.y{color:var(--yesil);font-weight:700}.t{color:var(--turuncu);font-weight:700}
  .bos{color:var(--muted);font-style:italic;padding:8px 0}
  .cubuklar{display:flex;align-items:flex-end;gap:10px;height:170px;margin:10px 0 4px;padding-top:10px}
  .cubuklar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
  .cubuklar i{display:block;width:100%;max-width:70px;background:var(--mor);border-radius:8px 8px 0 0;min-height:2px}
  .cubuklar b{color:var(--ink);font-size:12px;margin-bottom:3px}
  .son{background:var(--ink);color:#fff;border-radius:18px;padding:22px 24px;margin-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .son h3{margin:0 0 4px;font-size:20px}.son p{margin:0;opacity:.85}
  .son a{background:#fff;color:var(--ink);text-decoration:none;font-weight:800;padding:11px 18px;border-radius:12px}
  .notlar{font-size:12.5px;color:var(--muted);margin-top:16px}
  .notlar li{margin:3px 0}
  .hata{border-color:#f0c4c4;background:#fff6f6}
  .yazdir{position:fixed;right:18px;bottom:18px;background:var(--mor);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(85,70,234,.6)}
  .icerde .kap{padding:4px 2px 30px}
  .icerde .ust h1{font-size:22px}
  .icerde .marka{display:none}
  @media (max-width:720px){.uclu,.kutular{grid-template-columns:1fr 1fr}.tablo{overflow-x:auto}}
  @media print{
    body{background:#fff;font-size:12px}.kap{padding:0}.yazdir{display:none}
    section{border-color:#ccc}.manset{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .son{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:A4;margin:12mm}
  }
  .kisaca{border-left:5px solid var(--mor)}
  .kisaca p{margin:6px 0;font-size:15.5px}
  .isler{margin:0;padding-left:22px}
  .isler li{padding:9px 0;border-bottom:1px solid var(--line)}
  .isler li:last-child{border-bottom:0}
  .isler a{color:inherit;text-decoration:none;display:block}
  .isler span{display:block;font-size:13px;color:var(--muted);margin-top:2px;font-weight:700}
  .buyuk{font-size:clamp(30px,5vw,42px);font-weight:800;letter-spacing:-1px;margin:6px 0 12px}
  .buyuk span{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
  .serit{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--line)}
  .serit i{display:block;height:100%}
  .lejant{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:8px 0 14px}
  .lejant i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  table.hesap td{font-size:14px}
  table.hesap tr.ic td{color:var(--muted);font-size:13px}
  table.hesap tr.ic td:first-child{padding-left:22px}
  table.hesap tr.top td{font-weight:800;font-size:15px;border-top:2px solid var(--ink);border-bottom:0}
  .zaman{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .zaman div{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:8px;font-size:13px}
  .zaman i{display:block;height:14px;border-radius:7px;min-width:3px}
  .zaman b{text-align:right}
  .not{font-size:14px;margin:8px 0 0}
  .inceleme{margin-top:14px;background:#fff6f6;border:1px solid #f0c4c4;border-radius:14px;padding:12px 14px;font-size:14px}
  .inceleme .tablo{margin-top:8px}
  .liste{margin:0;padding-left:20px}.liste li{margin:6px 0}
  .terimler dl{margin:0}.terimler dt{font-weight:800;margin-top:10px}.terimler dd{margin:2px 0 0;color:var(--muted);font-size:14px}
  @media (max-width:720px){.zaman div{grid-template-columns:110px 1fr 58px}}
  .ciftler{display:flex;align-items:flex-end;gap:10px;height:190px;margin:12px 0 4px}
  .ciftler>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);min-width:0}
  .ciftler .c{display:flex;align-items:flex-end;gap:3px;width:100%;max-width:80px;justify-content:center}
  .ciftler i{display:block;flex:1;border-radius:6px 6px 0 0;min-height:2px}
  .ciftler b{font-size:11.5px;margin-bottom:3px;white-space:nowrap}
  .sonuc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
  .sonuc div{border-radius:14px;padding:12px 14px;background:var(--bg)}
  .sonuc b{display:block;font-size:21px}.sonuc span{font-size:12.5px;color:var(--muted)}
  @media (max-width:720px){.sonuc{grid-template-columns:1fr}.ciftler{gap:5px}}
</style></head>
<body>
<div class="kap" id="rapor">Rapor yükleniyor…</div>
<button class="yazdir" onclick="window.print()">🖨️ PDF olarak kaydet</button>
<script>
var VERI = /*VERI*/null;
var ICERDE = /*ICERDE*/false;   // uygulamanın içinde (Kârlılık → Sağlık) gösteriliyor: tanıtım ve yazdır düğmesi yok
(function(){
  if(ICERDE){ document.documentElement.className += ' icerde'; var yb = document.querySelector('.yazdir'); if(yb) yb.parentNode.removeChild(yb); }
  var V = VERI, el = document.getElementById('rapor');
  if(!V){ el.innerHTML = '<p>Rapor verisi yok. Bu dosya saglik-raporu.ps1 ile doldurulur.</p>'; return; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tl(v, o){ if(v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('tr-TR', { minimumFractionDigits: o || 0, maximumFractionDigits: o || 0 }) + ' ₺'; }
  function sy(v){ if(v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('tr-TR', { maximumFractionDigits: 1 }); }
  function gn(v){ if(v == null || !isFinite(v)) return '—'; return Math.round(v).toLocaleString('tr-TR') + ' gün'; }
  function yz(v){ if(v == null || !isFinite(v)) return '—'; var s = Math.abs(v * 100).toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); return (v < 0 ? '−' : '') + '%' + s; }
  function bol(a, b){ return (a != null && b) ? a / b : null; }
  var AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  function ayAd(a, kisa){ var n = AY[Number(String(a).slice(5)) - 1] || a; return (kisa ? n.slice(0, 3) + ' ' + String(a).slice(2, 4) : n + ' ' + String(a).slice(0, 4)); }
  var enf = (V.enflasyon || 0) / 100;

  // ---------- Hesaplar ----------
  var altinda = (V.altinda || []).map(function(r){ return { kod: r[0], ad: r[1], satis: r[2], alis: r[3], tarih: r[4], cari: r[5], m30: r[6] || 0, stok: r[7], zarar: Math.max(0, (r[3] - r[2]) * (r[6] || 0)) }; });
  var geride = (V.geride || []).map(function(r){ return { kod: r[0], ad: r[1], satis: r[2], onceki: r[3], alis: r[4], tarih: r[5], degisim: r[6], cari: r[7], m30: r[8] || 0, kacak: Math.max(0, (r[4] - r[3]) * (r[8] || 0)) }; });
  var oluD = V.olu ? V.olu.deger || 0 : 0;
  var k1 = altinda.reduce(function(t, x){ return t + x.zarar; }, 0);
  var k2 = geride.reduce(function(t, x){ return t + x.kacak; }, 0);
  var k3 = oluD * enf;
  var o = V.ozet || null;
  // Tedarikçi fiyat farkı / iskonto belgeleri: ürüne dağıtılamaz ama kârdır; geldiği ayın ve dönemin kârına eklenir.
  var FF = V.fiyatFarki || null, ff90 = FF ? FF.son90 || 0 : 0, ffAy = {};
  if(FF) (FF.aylar || []).forEach(function(r){ ffAy[r[0]] = r[1] || 0; });
  var malKar90 = o ? o.ciroMaliyetli - o.maliyet : null;
  var kar90 = o ? malKar90 + ff90 : null, marj90 = o && o.ciroMaliyetli > 0 ? kar90 / o.ciroMaliyetli : null;
  var aylikKar = kar90 != null ? kar90 / 3 : null;

  // Sermaye
  var S = V.sermaye || null, SM = null;
  if(S && !S.stok && S.alacak == null && S.borc == null) S = null;
  if(S){
    SM = {
      stok: S.stok ? S.stok.deger || 0 : 0, alacak: S.alacak || 0, borc: S.borc || 0,
      dio: S.smm90 > 0 && S.stok ? (S.stok.deger || 0) / (S.smm90 / 90) : null,
      dso: S.firmaSatis90 > 0 ? (S.alacak || 0) / (S.firmaSatis90 / 90) : null,
      dpo: S.alis90 > 0 ? (S.borc || 0) / (S.alis90 / 90) : null
    };
    SM.isletme = SM.stok + SM.alacak - SM.borc;
    SM.getiri = aylikKar != null && SM.isletme > 0 ? aylikKar / SM.isletme : null;
    SM.dongu = SM.dio != null ? SM.dio + (SM.dso || 0) - (SM.dpo || 0) : null;
    SM.gunlukSmm = S.smm90 > 0 ? S.smm90 / 90 : null;
  }

  // Aylar: marjı ortancanın belirgin altında kalan (bitmiş) ay = "inceleme gerektiren ay"
  var aylar = (V.aylar || []).map(function(r){ var ff = ffAy[r[0]] || 0, kar = r[2] - r[3] + ff; return { ay: r[0], ciro: r[1], kar: kar, ff: ff, marj: r[2] > 0 ? kar / r[2] : null, malMarj: r[2] > 0 ? (r[2] - r[3]) / r[2] : null }; });
  var buAy = aylar.length ? aylar[aylar.length - 1].ay : '';
  // Karşılaştırma malın kendi marjıyla yapılır (fiyat farkı geldiği ayı şişirip öteki ayları "düşük" göstermesin).
  var bitmis = aylar.filter(function(a){ return a.ay !== buAy && a.malMarj != null; }).map(function(a){ return a.malMarj; }).sort(function(a, b){ return a - b; });
  var ortanca = bitmis.length ? bitmis[Math.floor(bitmis.length / 2)] : null;
  // Düşük ay: hem malın kendi marjı hem fiyat farkı eklenmiş marj düşük olmalı (fiyat farkı aynı ay zararı kapattıysa sorun yok).
  aylar.forEach(function(a){ a.tuhaf = ortanca != null && a.ay !== buAy && a.malMarj != null && a.malMarj < ortanca - 0.05 && a.marj != null && a.marj < ortanca - 0.05; });
  // Sermaye hareketi: her ay alışla stoğa giren para, satışla (maliyet olarak) çıkan para.
  // Ay sonu stok, bugünkü stok değerinden geriye doğru bu farklar düşülerek tahmin edilir.
  var SA = null;
  if((V.sermayeAy || []).length){
    var karAy = {}; aylar.forEach(function(a){ karAy[a.ay] = a.kar; });
    var sr = V.sermayeAy.map(function(r){ var al = r[1] || 0, sm = r[2] || 0, dg = r[3] || 0; return { ay: r[0], alis: al, smm: sm, diger: dg, net: al - sm + dg, kar: karAy[r[0]] != null ? karAy[r[0]] : null }; });
    var stokSimdi = S && S.stok && S.stok.deger != null ? S.stok.deger : null;
    if(stokSimdi != null){ var e = stokSimdi; for(var i = sr.length - 1; i >= 0; i--){ sr[i].sonStok = e; e -= sr[i].net; sr[i].basStok = e; } }
    sr.forEach(function(x){ x.nakit = x.kar != null ? x.kar - x.net : null; });
    var topla = function(k){ return sr.reduce(function(t, x){ return t + (x[k] || 0); }, 0); };
    SA = { rows: sr, alis: topla('alis'), smm: topla('smm'), diger: topla('diger'), net: topla('net'), kar: topla('kar'), nakit: topla('nakit'),
           bas: sr[0].basStok, son: stokSimdi, ilk: sr[0].ay, buAyVar: sr[sr.length - 1].ay === buAy };
    var bitenler = sr.filter(function(x){ return x.ay !== buAy; }).slice(-3);
    SA.son3net = bitenler.reduce(function(t, x){ return t + x.net; }, 0);
    SA.son3kar = bitenler.reduce(function(t, x){ return t + (x.kar || 0); }, 0);
  }
  var ayZarar = {}; (V.ayZarar || []).forEach(function(r){ (ayZarar[r[0]] = ayZarar[r[0]] || []).push({ kod: r[1], ad: r[2], m: r[3], ciro: r[4], mal: r[5] }); });

  // ---------- Yapılacaklar (tutara göre sıralı) ----------
  var isler = [];
  if(k1 > 0) isler.push({ t: k1, a: '#altinda', m: '<b>' + altinda.length + ' ürünün raf fiyatını yükseltin.</b> Alış fiyatının altında satılıyorlar; her satışta zarar var.', e: 'Aylık ≈ ' + tl(k1) + ' zarar' });
  if(k2 > 0) isler.push({ t: k2, a: '#geride', m: '<b>' + geride.length + ' ürünün fiyatını yeni alışa göre güncelleyin.</b> Alışları %3\'ten fazla arttı, raf fiyatı yerinde sayıyor.', e: 'Aylık ≈ ' + tl(k2) + ' kaçak' });
  if(S && S.riskli > 0) isler.push({ t: S.riskli * 0.05, a: '#alacak', m: '<b>' + sy(S.riskliN) + ' müşteriden toplam ' + tl(S.riskli) + ' tahsil edilmeli.</b> 6 aydır hiç hareketleri yok; alacak eskidikçe tahsili zorlaşır.', e: tl(S.riskli) + ' bekleyen alacak' });
  if(oluD > 0) isler.push({ t: k3, a: '#olu', m: '<b>' + tl(oluD) + ' değerindeki satılmayan stoğu paraya çevirin.</b> 90 gündür hiç satılmamış ' + sy(V.olu.adet) + ' ürün: indirim, tedarikçiye iade ya da raf yeri değişikliği.', e: 'Aylık ≈ ' + tl(k3) + ' değer kaybı' });
  if(SM && SM.dio != null && SM.dio > 45 && SM.gunlukSmm) isler.push({ t: SM.gunlukSmm * 10 * enf, a: '#sermaye', m: '<b>Stok ' + gn(SM.dio) + 'lük — siparişleri küçültün.</b> Stok 10 gün kısalırsa yaklaşık ' + tl(SM.gunlukSmm * 10) + ' nakit serbest kalır.', e: '10 gün = ' + tl(SM.gunlukSmm * 10) });
  if(SM && SM.getiri != null && SM.getiri < enf) isler.push({ t: Math.max(0, (enf - SM.getiri) * SM.isletme), a: '#sermaye', m: '<b>İşletmeye bağlı para enflasyonun gerisinde kalıyor.</b> Brüt kâr bağlı paranın ayda ' + yz(SM.getiri) + '\'i, enflasyon ' + yz(enf) + '.', e: 'Fark ≈ ' + tl((enf - SM.getiri) * SM.isletme) + ' / ay' });
  if(SA && SA.son3kar > 0 && SA.son3net > SA.son3kar * 0.5) isler.push({ t: SA.son3net * enf, a: '#sermayeAy', m: '<b>Son 3 ayda brüt kârın ' + yz(SA.son3net / SA.son3kar) + '\'i stoğa gitti.</b> Satılandan çok mal alınıyor; kâr kasaya değil rafa dönüyor. Siparişleri satış hızına göre küçültün.', e: tl(SA.son3net) + ' stoğa bağlandı' });
  aylar.filter(function(a){ return a.tuhaf; }).forEach(function(a){ isler.push({ t: 0, a: '#aylar', m: '<b>' + ayAd(a.ay) + ' marjı (' + yz(a.marj) + ') diğer aylardan çok düşük.</b> Aylık tablonun altında o ay kârı en çok düşüren ürünler var; çoğu zaman yanlış girilmiş bir alış fiyatıdır.', e: 'Kontrol edin' }); });
  if(S && S.stok && S.stok.eksi > 0) isler.push({ t: 0, a: '#kalite', m: '<b>' + sy(S.stok.eksi) + ' üründe stok eksi görünüyor.</b> Sayım ya da mal girişi eksik; stok değeri ve sipariş önerileri bundan etkilenir.', e: 'Veri düzeltme' });
  isler.sort(function(a, b){ return b.t - a.t; });

  // ---------- Çizim ----------
  var h = '<div class="ust"><div><h1>Mağaza Sağlık Raporu</h1><div class="alt">' + esc(V.firma || 'Mağaza') + ' · ' + esc(V.olusturma) + ' · ERP12 (' + esc(V.veritabani) + ')</div></div><div class="marka">KRT <i>Saha</i><div class="alt" style="font-weight:400">krtsaha.com</div></div></div>';

  // Kısaca
  var kisa = [];
  if(o) kisa.push('Son 90 günde <b>' + tl(o.ciro) + '</b> satış yaptınız (KDV hariç) ve bunun <b>' + tl(kar90) + '</b>\'si brüt kâr kaldı' + (ff90 ? ' (' + tl(ff90) + ' tedarikçi fiyat farkı dahil)' : '') + ' — her 100 ₺\'lik satıştan <b>' + sy(marj90 * 100) + ' ₺</b>. Bu, ayda ortalama <b>' + tl(aylikKar) + '</b> brüt kâr demek.');

      '<p class="ac">Son altı ayda firmalarla yapılan fiyat farkı ve iskonto belgeleri (KDV hariç). Hangi ürüne ait olduğu belli olmadığı için ürün kârlarına değil, ayın toplam kârına eklenir. Eksi tutar: tedarikçinin size kestiği fiyat farkı.</p>' +
      '<div class="tablo"><table><tr><th>Firma</th><th>Tutar</th><th>Belge satırı</th><th>Son belge</th></tr>' +
      FF.cariler.map(function(r){ return '<tr><td>' + esc(r[0] || '(cari yok)') + '</td><td class="' + (r[1] < 0 ? 'k' : 'y') + '">' + tl(r[1]) + '</td><td>' + sy(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('') + '</table></div></section>';
  }
  // Alışın altında
  h += '<section id="altinda"><h2>🔻 Alış fiyatının altında satılan ürünler <small class="k">' + tl(k1) + ' / ay</small></h2>' +
    '<p class="ac">Bugünkü raf fiyatı, ürünün en son alış fiyatından (iskontolar düşülmüş, KDV hariç) düşük. Her satışta zarar ediliyor. Aylık zarar = son 30 günde satılan × fark.</p>' +
    (altinda.length ? '<div class="tablo"><table><tr><th>Ürün</th><th>Raf fiyatı</th><th>Son alış</th><th>Fark</th><th>30 günde satılan</th><th>Aylık zarar</th></tr>' +
      altinda.slice(0, 40).map(function(x){ return '<tr><td>' + esc(x.ad) + '<small>' + esc(x.kod) + ' · ' + esc(x.cari) + ' · ' + esc(x.tarih) + '</small></td><td>' + tl(x.satis, 2) + '</td><td>' + tl(x.alis, 2) + '</td><td class="k">' + tl(x.satis - x.alis, 2) + '</td><td>' + sy(x.m30) + '</td><td class="k">' + tl(x.zarar) + '</td></tr>'; }).join('') + '</table></div>' +
      (altinda.length > 40 ? '<p class="ac">… ve ' + (altinda.length - 40) + ' ürün daha' + (altinda.length >= 200 ? ' (liste en fazla 200 ürün gösterir)' : '') + '.</p>' : '')
      : '<div class="bos">Alışın altında satılan ürün yok. 👍</div>') + '</section>';
  // Fiyatı güncellenmeyen
  h += '<section id="geride"><h2>📉 Alışı arttı, satış fiyatı güncellenmedi <small class="t">' + tl(k2) + ' / ay</small></h2>' +
    '<p class="ac">Son alış bir öncekinden en az %3 pahalı geldi ama raf fiyatı o tarihten beri değişmedi. Hâlâ kârlı görünse de marj eriyor. Aylık kaçak = son 30 günde satılan × alıştaki artış.</p>' +
    (geride.length ? '<div class="tablo"><table><tr><th>Ürün</th><th>Önceki alış</th><th>Son alış</th><th>Artış</th><th>Raf fiyatı</th><th>Son fiyat değişimi</th><th>Aylık kaçak</th></tr>' +
      geride.slice(0, 40).map(function(x){ return '<tr><td>' + esc(x.ad) + '<small>' + esc(x.kod) + ' · ' + esc(x.cari) + ' · alış ' + esc(x.tarih) + '</small></td><td>' + tl(x.onceki, 2) + '</td><td>' + tl(x.alis, 2) + '</td><td class="t">' + yz(x.onceki > 0 ? x.alis / x.onceki - 1 : null) + '</td><td>' + tl(x.satis, 2) + '</td><td>' + esc(x.degisim || 'kayıt yok') + '</td><td class="t">' + tl(x.kacak) + '</td></tr>'; }).join('') + '</table></div>' +
      (geride.length > 40 ? '<p class="ac">… ve ' + (geride.length - 40) + ' ürün daha.</p>' : '')
      : '<div class="bos">Bu durumda ürün yok. 👍</div>') + '</section>';
  // Satılmayan stok
  if(V.olu){
    h += '<section id="olu"><h2>💤 90 gündür satılmayan stok <small>' + tl(V.olu.deger) + '</small></h2>' +
      '<p class="ac">' + sy(V.olu.adet) + ' ürün stokta duruyor ama 90 gündür hiç satılmadı. Bu para rafta bekliyor; enflasyonda her ay değer kaybediyor (aylık ≈ ' + tl(k3) + '). İndirim, tedarikçiye iade ya da raf yerini değiştirmek düşünülebilir.</p>' +
      ((V.olu.liste || []).length ? '<div class="tablo"><table><tr><th>Ürün</th><th>Stok</th><th>Son alış</th><th>Bağlı para</th><th>Son satış</th></tr>' +
        V.olu.liste.slice(0, 30).map(function(r){ return '<tr><td>' + esc(r[1]) + '<small>' + esc(r[0]) + '</small></td><td>' + sy(r[2]) + '</td><td>' + tl(r[3], 2) + '</td><td>' + tl(r[4]) + '</td><td>' + esc(r[5] || '6 aydan eski') + '</td></tr>'; }).join('') + '</table></div>' : '<div class="bos">Yok. 👍</div>') + '</section>';
  }
  // Ürün grupları
  if(V.urunler && V.urunler.length){
    var u = V.urunler.filter(function(r){ return r[4] != null && r[3] > 0; }).map(function(r){ var kar = r[3] - r[4]; return { kod: r[0], ad: r[1], m: r[2], ciro: r[3], kar: kar, marj: kar / r[3] }; });
    var kazandiran = u.slice().sort(function(a, b){ return b.kar - a.kar; }).slice(0, 12);
    var surum = u.filter(function(x){ return x.marj < 0.08; }).sort(function(a, b){ return b.ciro - a.ciro; }).slice(0, 12);
    var tablo = function(l, renk){ return l.length ? '<div class="tablo"><table><tr><th>Ürün</th><th>90 gün satış</th><th>Satış tutarı</th><th>Brüt kâr</th><th>Marj</th></tr>' + l.map(function(x){ return '<tr><td>' + esc(x.ad) + '<small>' + esc(x.kod) + '</small></td><td>' + sy(x.m) + '</td><td>' + tl(x.ciro) + '</td><td class="' + (x.kar < 0 ? 'k' : renk) + '">' + tl(x.kar) + '</td><td>' + yz(x.marj) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="bos">Yok.</div>'; };
    h += '<section><h2>⭐ Para kazandıran ürünler</h2><p class="ac">Son 90 günde en çok brüt kâr bırakan ürünler. Rafta ve stokta hiç eksik olmamalı.</p>' + tablo(kazandiran, 'y') + '</section>';
    h += '<section><h2>🔁 Çok satan ama az kazandıran (sürüm ürünleri)</h2><p class="ac">Satışta üst sıralarda, marjı %8\'in altında. Müşteriyi çeker ama kâr bırakmaz; fiyat ya da alış şartları gözden geçirilmeli.</p>' + tablo(surum, '') + '</section>';
  }
  // Kasa iptalleri
  if(V.iptal){
    var ip = V.iptal, sat = 0, satT = 0, fis = 0, fisT = 0;
    (ip.kisiler || []).forEach(function(k){ sat += k[1]; satT += k[2] || 0; fis += k[3]; fisT += k[4] || 0; });
    h += '<section><h2>🧾 Kasa iptalleri — son 30 gün</h2><p class="ac">' + sy(ip.fisSayisi) + ' kasa fişine karşılık <b>' + sy(sat) + '</b> satır iptali (' + tl(satT) + ') ve <b>' + sy(fis) + '</b> fiş iptali (' + tl(fisT) + '). ' +
      (ip.fisSayisi > 0 ? 'Her 100 fişte ' + sy(sat / ip.fisSayisi * 100) + ' satır iptali. ' : '') + 'Çoğu yanlış okutma ya da müşterinin vazgeçmesidir; bir kasiyerde ötekilerden belirgin fazlaysa bakmaya değer.</p>' +
      ((ip.kisiler || []).length ? '<div class="tablo"><table><tr><th>Kasiyer</th><th>Satır iptali</th><th>Tutarı</th><th>Fiş iptali</th><th>Tutarı</th></tr>' +
        ip.kisiler.slice().sort(function(a, b){ return (b[2] + b[4]) - (a[2] + a[4]); }).map(function(k){ return '<tr><td>' + esc(k[0]) + '</td><td>' + sy(k[1]) + '</td><td>' + tl(k[2]) + '</td><td>' + sy(k[3]) + '</td><td>' + tl(k[4]) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="bos">Kayıt yok.</div>');
    if((ip.saatler || []).length){
      var smx = Math.max.apply(null, ip.saatler.map(function(s){ return s[1]; }));
      h += '<p class="ac" style="margin-top:14px">Saatlere göre iptal sayısı</p><div class="cubuklar" style="height:110px">' + ip.saatler.map(function(s){ return '<div><b>' + s[1] + '</b><i style="height:' + Math.max(2, Math.round(s[1] / smx * 80)) + 'px;background:#c76a00"></i>' + s[0] + '</div>'; }).join('') + '</div>';
    }
    h += '</section>';
  }
  // Veri kalitesi
  var kal = [];
  if(S && S.stok){
    if(S.stok.eksi) kal.push('<b>' + sy(S.stok.eksi) + ' üründe stok eksi.</b> Satıldığı halde girişi yapılmamış ya da sayımı eksik. Bu ürünler stok değerine katılmadı.');
    if(S.stok.maliyetsiz) kal.push('<b>' + sy(S.stok.maliyetsiz) + ' ürün stokta ama hiç alış kaydı yok.</b> Değerleri bilinmediği için stok toplamına girmedi.');
  }
  if(o && o.ciro > 0 && o.ciroMaliyetli < o.ciro) kal.push('Satışların <b>' + yz(1 - o.ciroMaliyetli / o.ciro) + '</b>\'i alış kaydı olmayan ürünlerden; bu kısmın kârı hesaplanamadı.');
  if(kal.length) h += '<section id="kalite"><h2>🧹 Veri kalitesi</h2><p class="ac">Rakamların doğruluğu ERP\'deki kayıtlara bağlı. Bunlar düzeldikçe rapor daha kesin olur.</p><ul class="liste">' + kal.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul></section>';
  // Terimler
  h += '<section class="terimler"><h2>📖 Terimler</h2><dl>' +
    '<dt>Brüt kâr</dt><dd>Satış tutarı − satılan malın alış maliyeti + tedarikçilerden gelen fiyat farkı / iskonto. Kira, maaş, elektrik gibi giderler düşülmemiştir.</dd>' +
    '<dt>Marj</dt><dd>Brüt kârın satışa oranı. %15 marj: 100 ₺\'lik satışta 15 ₺ brüt kâr.</dd>' +
    '<dt>Bağlı para (işletme sermayesi)</dt><dd>Stok + müşterilerin size borcu − sizin tedarikçilere borcunuz. İşin dönmesi için cebinizden içeride tuttuğunuz para.</dd>' +
    '<dt>Sermaye getirisi</dt><dd>Aylık brüt kârın bağlı paraya oranı. Enflasyonun altındaysa, para işletmede durdukça reel olarak küçülüyor demektir.</dd>' +
    '<dt>Stok kaç günlük</dt><dd>Bugünkü satış hızıyla, yeni mal gelmezse stoğun kaç günde biteceği. Market için genelde 20–40 gün yeterlidir.</dd>' +
    '<dt>Stoğa bağlanan para</dt><dd>Alış − satılan malın maliyeti. Artıysa kârın bir kısmı nakit yerine stok olarak duruyor; eksiyse stok eritilip nakde çevrilmiş.</dd>' +
    '<dt>Nakit döngüsü</dt><dd>Stok günü + müşteri tahsilat günü − tedarikçi ödeme günü. Kısaldıkça aynı ciroyu daha az parayla yaparsınız.</dd></dl></section>';
  if(!ICERDE) h += '<div class="son"><div><h3>KRT Saha bunları her gün kendisi izler.</h3><p>Alışın altına düşen fiyat, güncellenmeyen etiket, satılmayan stok ve kasa sapmaları sabah tek ekranda. Sayım, mal kabul, etiket, plasiyer ve kasa tahsilatı da aynı uygulamada.</p></div><a href="https://krtsaha.com">krtsaha.com</a></div>';
  h += '<ul class="notlar"><li>Satış, maliyet ve kâr tutarları KDV hariçtir; cari bakiyeler ERP\'deki gibi (KDV dahil) alınmıştır. Veriler ERP veri tabanından yalnız okunarak alındı; ERP\'ye hiçbir şey yazılmadı.</li>' +
    '<li>Maliyet: ürünün satıldığı ayda geçerli son net alış fiyatı (satır ve dip iskontoları düşülmüş), koli/paket alımları adede çevrilerek. Alışı hiç olmayan ürünlerin kârı hesaplanmadı; bedelsiz gelen satırlar maliyet sayılmadı.</li>' +
    '<li>Fiyat farkı ve iskonto belgeleri ürün kârlarına değil, ayın ve dönemin toplam brüt kârına ayrı satır olarak eklendi. Nakliye gibi mal olmayan kartlar ve yalnız iadesi olan (o dönemde net satışı olmayan) ürünler hesaba katılmadı.</li>' +
    '<li>Stok değeri: stoktaki miktar × son net alış fiyatı. Sermaye hesabına kasa, banka, demirbaş ve krediler dahil değildir.</li>' +
    '<li>"Kaçan tutar" tahminidir: son 30 günün satış hızı ile bugünkü fiyat ve maliyet farkından hesaplanır; satılmayan stoğun değer kaybı için aylık %' + sy(V.enflasyon) + ' kullanıldı.</li></ul>';
  if((V.hatalar || []).length) h += '<section class="hata"><h2>Hesaplanamayan bölümler</h2><ul>' + V.hatalar.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></section>';
  el.innerHTML = h;

  function gunOnce(t){ var p = String(t).split('.'); if(p.length !== 3) return 9999; return (Date.now() - new Date(+p[2], +p[1] - 1, +p[0]).getTime()) / 86400000; }
})();
</script>
</body>
</html>
