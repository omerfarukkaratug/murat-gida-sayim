<title>Kârlılık</title>

<!--
  KRT Saha — 💰 KÂRLILIK RAPORU. index.html içinde çerçevede açılır (gomulu=1).
  Hangi ürün para kazandırıyor, hangisi yalnız sürüm yapıyor, fiyatlar ve maliyetler enflasyona göre nerede.
  Yetki: yönetici ya da "karlilik". Maliyet içerir. ERP'ye hiçbir şey yazmaz; ERP'den gelen veriyi okur.
  Tutarlar KDV HARİÇ. Maliyet = satıldığı ayda geçerli son NET alış (iskontolar düşülmüş).
-->
<style>
  :root{
    --bg:#f2f8ec; --panel:#ffffff; --panel2:#e4f1d8; --line:#c3dfad;
    --text:#10281a; --muted:#527a5f; --green:#15803d; --amber:#b45309; --red:#c81e1e; --blue:#1d4ed8;
    --accent:#15803d; --accent2:#1fa04e;

    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1610; --panel:#14211a; --panel2:#1c2e23; --line:#2b4535;
      --text:#e7f3ea; --muted:#94b49f; --green:#22c55e; --amber:#f59e0b; --red:#f87171; --blue:#60a5fa; --accent:#22c55e; --accent2:#34d26e; }
  }
  html{touch-action:pan-x pan-y;}
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-text-size-adjust:100%;}
  body{padding:12px 14px calc(24px + env(safe-area-inset-bottom)); max-width:900px; margin:0 auto; overflow-x:clip;}
  .gizli{display:none !important;}
  .kart{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .kartBaslik{font-weight:800; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .ipucu{font-size:12.5px; color:var(--muted); line-height:1.5;}
  button{font-family:inherit; font-size:14px; font-weight:800; border-radius:12px; padding:9px 12px; border:1.5px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer;}
  button.ana{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.kucuk{font-size:12.5px; padding:6px 10px; border-radius:10px;}
  input,select{font-size:16px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--panel2); color:var(--text); font-family:inherit; width:100%;}
  .sekmeler{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:0 -14px 12px; padding:2px 14px 4px;}
  .sekmeler::-webkit-scrollbar{display:none;}
  .sekmeler button{flex-shrink:0; font-size:13.5px; padding:8px 12px; border-radius:20px; white-space:nowrap;}
  .sekmeler button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .ust{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .ust select{width:auto; flex:1;}
  .kutular{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-bottom:12px;}
  .kutu{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
  .kutu .b{font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .kutu .d{font-size:19px; font-weight:800; font-family:var(--mono); margin-top:3px; white-space:nowrap;}
  .kutu .a{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.35;}
  .iyi{color:var(--green);} .kotu{color:var(--red);} .uyari{color:var(--amber);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:right; padding:6px 4px; border-bottom:1.5px solid var(--line); white-space:nowrap;}
  th:first-child, td:first-child{text-align:left;}
  td{padding:7px 4px; border-bottom:1px solid var(--line); text-align:right; font-family:var(--mono); white-space:nowrap;}
  td:first-child{font-family:var(--sans); white-space:normal;}
  .tablo{overflow-x:auto; margin:0 -4px;}
  .cubuk{height:8px; border-radius:4px; background:var(--accent); display:inline-block; vertical-align:middle;}
  .cubuk.r{background:var(--blue); opacity:.7;}
  .urun{padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .urun:last-child{border-bottom:none;}
  .urun .s1{display:flex; justify-content:space-between; gap:8px; font-weight:800; font-size:14px;}
  .urun .s1 span:first-child{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .urun .s2{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin-top:3px; font-family:var(--mono);}
  .etk{display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; background:var(--panel2); margin:4px 4px 0 0; font-family:var(--sans);}
  .etk.k{background:rgba(200,30,30,.13); color:var(--red);} .etk.u{background:rgba(180,83,9,.14); color:var(--amber);} .etk.y{background:rgba(21,128,61,.14); color:var(--green);}
  .cipler{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .cipler button{font-size:12.5px; padding:6px 10px; border-radius:20px;}
  .cipler button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .detay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
  .detay .ic{background:var(--panel); width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
  .sat{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .sat span:last-child{font-family:var(--mono); font-weight:700; text-align:right;}
  #toast{position:fixed; left:14px; right:14px; bottom:calc(18px + env(safe-area-inset-bottom)); max-width:612px; margin:0 auto; padding:13px 16px; border-radius:14px; font-weight:800; color:#fff; z-index:50; text-align:center;}
  .bekle{text-align:center; padding:40px 10px; color:var(--muted); font-weight:700;}
  .tufeIzgara{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:6px;}
  .tufeIzgara label{font-size:11.5px; font-weight:800; color:var(--muted);}
  .tufeIzgara input{padding:7px 9px; font-size:15px;}
</style>
</head>
<body>
  <div class="ust">
    <select id="donem">
      <option value="30">Son 30 gün</option>

<script>
(function(){
  'use strict';
  var SUNUCU_VARSAYILAN = (/(^|\.)(krtsaha\.com|github\.io)$/.test(location.hostname) ? 'https://sunucu.krtsaha.com/exec' : 'https://script.google.com/macros/s/AKfycbwH0hVGDXIQhdSxg2neDBNUEOxY1SNacJRz4cqf3WaP8xgAhlEnKfRv5xnlENKnh3XuYA/exec');
  if (/^(sunucu\.|localhost$|127\.0\.0\.1$)/.test(location.hostname) && /^https?:$/.test(location.protocol)) SUNUCU_VARSAYILAN = location.origin + '/exec';
  function oku(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function norm(s){ return String(s || '').toLocaleLowerCase('tr-TR').replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c'); }
  function tl(v, ond){ if(v == null || !isFinite(v)) return '—'; return (Number(v) || 0).toLocaleString('tr-TR', { minimumFractionDigits: ond || 0, maximumFractionDigits: ond || 0 }) + ' ₺'; }
  function sayi(v, ond){ if(v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('tr-TR', { maximumFractionDigits: ond == null ? 1 : ond }); }
  function yuzde(v, isaret){ if(v == null || !isFinite(v)) return '—'; var s = Math.abs(v * 100).toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); return (v < 0 && s !== '0,0' ? '−' : (isaret && v > 0 ? '+' : '')) + '%' + s; }
  function renk(v){ return v == null || !isFinite(v) ? '' : v < 0 ? 'kotu' : 'iyi'; }

  var meta = oku('sayimApp_meta_v2') || {};
  var sunucu = (meta.serverUrl && meta.serverUrl.indexOf('script.google.com') === -1) ? meta.serverUrl : SUNUCU_VARSAYILAN;

  var istekNo = 0;

  // ---------- Hesap ----------
  var V = null, U = [], OZ = null, sekme = 'ozet', filtre = 'hepsi', sirala = 'kar', ara = '', enfFiltre = 'geri';

    yildiz: ['⭐ Para kazandıran', 'Çok satıyor ve marjı ortalamanın üstünde — rafta, stokta asla eksik olmasın.', 'y'],
    surum:  ['🔁 Sürüm ürünü', 'Çok satıyor ama marjı düşük — müşteri çeker, kârı az. Fiyatı ve alış şartları gözden geçirilmeli.', 'u'],
    nis:    ['💎 Az satan ama kârlı', 'Marjı yüksek, satışı az — görünür yere koymak, önermek kâr getirir.', 'y'],
    zayif:  ['🐢 Az satan, az kazandıran', 'Hem satışı hem marjı düşük — raf yeri ve stok bağlamaya değer mi?', ''],
    zarar:  ['🔻 Zarar eden', 'Dönemde maliyetinin altında satılmış.', 'k'],
    maliyetsiz: ['❔ Alışı bilinmeyen', 'ERP\'de alış kaydı yok; kârı hesaplanamadı.', '']
  };
  // Son 12 ayın birikimli TÜFE'si (rapor ayından önceki 12 tam ay; eksik ay varsa bilinenlerle)
  function tufeBirikim(bitisAy, ay){
    var t = V.tufe || {}, c = 1, n = 0, d = new Date(bitisAy + '-01T00:00:00');
    for(var i = 0; i < ay; i++){
      var k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
      if(t[k] != null){ c *= 1 + Number(t[k]) / 100; n++; }
      d.setMonth(d.getMonth() - 1);
    }
    return { oran: c - 1, ay: n };
  }
  function sonrakiAy(k){ var d = new Date(k + '-01T00:00:00'); d.setMonth(d.getMonth() + 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function oncekiAy(k){ var d = new Date(k + '-01T00:00:00'); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function hesapla(){
    var gun = V.gun, bugunAy = V.bugun.slice(6, 10) + '-' + V.bugun.slice(3, 5);
    var t12 = tufeBirikim(oncekiAy(bugunAy), 12);
    OZ = { ciro: 0, maliyet: 0, maliyetsiz: 0, kar: 0, yk: 0, kasa: 0, firma: 0, t12: t12, geri: 0, altinda: 0, ykZarar: 0, ortMarj: 0 };
    U = (V.urunler || []).map(function(r){
      var m = (Number(r[2]) || 0) + (Number(r[3]) || 0), ciro = Number(r[4]) || 0, mal = Number(r[5]) || 0, msz = Number(r[6]) || 0;
      var kCiro = ciro - msz, kar = kCiro - mal, mOran = ciro > 0 ? kCiro / ciro : 0, kM = m * mOran;
      var sonAlis = r[7] != null ? Number(r[7]) : null, satis = r[18] != null ? Number(r[18]) : null;
      var u = { kod: r[0], ad: r[1] || r[0], kasaM: Number(r[2]) || 0, firmaM: Number(r[3]) || 0, m: m, ciro: ciro, maliyet: mal, maliyetsiz: msz,
        kCiro: kCiro, kar: kar, marj: kCiro > 0 && mal > 0 ? kar / kCiro : null,
        sonAlis: sonAlis, sonAlisT: r[8], cari: r[9], cariAd: r[10], alisOnce: r[11] != null ? Number(r[11]) : null,
        kasaBirim: r[12] != null ? Number(r[12]) : null, kasaBirimOnce: r[13] != null ? Number(r[13]) : null,
        kdv: r[14], ilk: r[15], gunSay: r[16], stok: r[17] != null ? Number(r[17]) : null, satis: satis, katalog: r[19] };
      u.yk = sonAlis != null && mal > 0 ? kCiro - kM * sonAlis : null;               // yerine koyma kârı
      u.enfPay = u.yk != null ? kar - u.yk : null;                                      // kârın eski ucuz maliyetten gelen kısmı
      u.guncelMarj = satis > 0 && sonAlis != null ? (satis - sonAlis) / satis : null;
      u.fiyatArtis = u.kasaBirim > 0 && u.kasaBirimOnce > 0 ? u.kasaBirim / u.kasaBirimOnce - 1 : null;
      u.alisArtis = sonAlis > 0 && u.alisOnce > 0 ? sonAlis / u.alisOnce - 1 : null;
      u.reelFiyat = u.fiyatArtis != null && t12.ay >= 6 ? (1 + u.fiyatArtis) / (1 + t12.oran) - 1 : null;
      u.gunluk = m / gun;
      u.devir = u.stok > 0 && u.gunluk > 0 ? u.stok / u.gunluk : (u.stok > 0 ? Infinity : null);
      u.stokDeger = u.stok > 0 && sonAlis ? u.stok * sonAlis : 0;

      return u;
    });
    var kCiroTop = U.reduce(function(t, u){ return t + (u.maliyet > 0 ? u.kCiro : 0); }, 0);
    OZ.ortMarj = kCiroTop > 0 ? OZ.kar / kCiroTop : 0;
    // Sürüm sınırı: cironun %80'ini yapan ürünler "çok satan"
    var s = U.slice().sort(function(a, b){ return b.ciro - a.ciro; }), top = 0, sinir = OZ.ciro * 0.8;

      if(u.reelFiyat != null && u.reelFiyat < -0.05) OZ.geri++;
      if(u.yk != null && u.yk < 0 && u.kar >= 0) OZ.ykZarar++;

  // ---------- Çizim ----------
  var SEKMELER = [['ozet', '📊 Özet'], ['urunler', '🛒 Ürünler'], ['enflasyon', '📈 Enflasyon'], ['firmalar', '🏭 Firmalar'], ['sermaye', '💼 Sermaye'], ['oneri', '💡 Öneriler'], ['saglik', '🩺 Sağlık'], ['tufe', '⚙️ TÜFE']];
  function sekmeCiz(){

  function kutu(b, d, a, sinif){ return '<div class="kutu"><div class="b">' + b + '</div><div class="d ' + (sinif || '') + '">' + d + '</div>' + (a ? '<div class="a">' + a + '</div>' : '') + '</div>'; }
  function ciz(){

    if(!V){ if(getirHata) $('icerik').innerHTML = getirHata; return; }

    $('icerik').innerHTML = h;

  function ozetHtml(){
    var enfPay = OZ.kar - OZ.yk;
    var h = '<div class="ipucu" style="margin-bottom:8px;">' + esc(V.bas) + ' – ' + esc(V.bugun) + ' · KDV hariç · ERP verisi: ' + esc(V.sonVeri || '—') + '</div>';

    '</div>';
